name: "repositories"
title: "GitHub Repositories"
description: "Tasks that search GitHub repositories and download repository archives."
body: "Search repositories with a GitHub token and return metadata such as stars, forks, and languages, or download a zip or gzip-compressed tar archive for a commit, branch, or tag into Kestra internal storage. The token is optional when downloading a public repository."
